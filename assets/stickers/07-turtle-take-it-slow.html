<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      width: 1200px; height: 1200px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: "Baloo 2", sans-serif;
    }
    .diecut {
      filter:
        drop-shadow(16px 0 0 #fff) drop-shadow(-16px 0 0 #fff)
        drop-shadow(0 16px 0 #fff) drop-shadow(0 -16px 0 #fff)
        drop-shadow(0 14px 22px rgba(29,53,87,0.30));
    }
    .stack { display: flex; flex-direction: column; align-items: center; }
    .turtle { height: 620px; width: auto; }
    .line1 { color: #1d3557; font-weight: 800; font-size: 120px; margin-top: 8px; line-height: 1; }
    .line2 {
      background: #2ec4b6; color: #fff;
      font-weight: 800; font-size: 96px; letter-spacing: 6px;
      padding: 4px 48px 16px; border-radius: 70px;
      margin-top: 14px; transform: rotate(-2deg);
    }
  </style>
</head>
<body>
  <div class="diecut stack">
    <img class="turtle" src="../../public/characters/turtle.svg" alt="Sea turtle">
    <div class="line1">TAKE IT</div>
    <div class="line2">SLOW</div>
  </div>
</body>
</html>
