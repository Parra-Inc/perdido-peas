<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      width: 1200px; height: 1200px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: "Baloo 2", sans-serif;
    }
    .diecut {
      filter:
        drop-shadow(16px 0 0 #fff) drop-shadow(-16px 0 0 #fff)
        drop-shadow(0 16px 0 #fff) drop-shadow(0 -16px 0 #fff)
        drop-shadow(0 14px 22px rgba(29,53,87,0.30));
    }
  </style>
</head>
<body>
  <div class="diecut">
    <!-- seven smiling peas in a pod, each in tiny sunglasses (dedication-page motif) -->
    <svg width="1040" height="900" viewBox="0 0 1040 900" xmlns="http://www.w3.org/2000/svg">
      <!-- pod: open crescent boat -->
      <path d="M 60 560 Q 520 380 980 560 Q 520 900 60 560 Z" fill="#3e9b4f" stroke="#2c7a3b" stroke-width="14" stroke-linejoin="round"/>
      <path d="M 60 560 Q 520 460 980 560 Q 520 700 60 560 Z" fill="#2c7a3b" opacity="0.35"/>
      <!-- stem curl -->
      <path d="M 980 560 q 60 -50 30 -110" fill="none" stroke="#2c7a3b" stroke-width="14" stroke-linecap="round"/>
      <!-- seven peas -->
      <g stroke="#2c7a3b" stroke-width="10">
        <circle cx="190" cy="520" r="78" fill="#7bc950"/>
        <circle cx="330" cy="490" r="82" fill="#7bc950"/>
        <circle cx="470" cy="475" r="86" fill="#7bc950"/>
        <circle cx="610" cy="475" r="86" fill="#7bc950"/>
        <circle cx="750" cy="490" r="82" fill="#7bc950"/>
        <circle cx="880" cy="520" r="74" fill="#7bc950"/>
        <circle cx="520" cy="600" r="64" fill="#7bc950"/>
      </g>
      <!-- tiny sunglasses + smiles -->
      <g fill="#1d3557">
        <g transform="translate(190,520)"><rect x="-46" y="-26" width="36" height="24" rx="10"/><rect x="10" y="-26" width="36" height="24" rx="10"/><rect x="-12" y="-20" width="24" height="8" rx="4"/><path d="M -24 26 Q 0 46 24 26" fill="none" stroke="#1d3557" stroke-width="9" stroke-linecap="round"/></g>
        <g transform="translate(330,490)"><rect x="-46" y="-26" width="36" height="24" rx="10"/><rect x="10" y="-26" width="36" height="24" rx="10"/><rect x="-12" y="-20" width="24" height="8" rx="4"/><path d="M -24 28 Q 0 48 24 28" fill="none" stroke="#1d3557" stroke-width="9" stroke-linecap="round"/></g>
        <g transform="translate(470,475)"><rect x="-48" y="-28" width="38" height="26" rx="10"/><rect x="10" y="-28" width="38" height="26" rx="10"/><rect x="-12" y="-21" width="24" height="8" rx="4"/><path d="M -26 30 Q 0 52 26 30" fill="none" stroke="#1d3557" stroke-width="9" stroke-linecap="round"/></g>
        <g transform="translate(610,475)"><rect x="-48" y="-28" width="38" height="26" rx="10"/><rect x="10" y="-28" width="38" height="26" rx="10"/><rect x="-12" y="-21" width="24" height="8" rx="4"/><path d="M -26 30 Q 0 52 26 30" fill="none" stroke="#1d3557" stroke-width="9" stroke-linecap="round"/></g>
        <g transform="translate(750,490)"><rect x="-46" y="-26" width="36" height="24" rx="10"/><rect x="10" y="-26" width="36" height="24" rx="10"/><rect x="-12" y="-20" width="24" height="8" rx="4"/><path d="M -24 28 Q 0 48 24 28" fill="none" stroke="#1d3557" stroke-width="9" stroke-linecap="round"/></g>
        <g transform="translate(880,520)"><rect x="-42" y="-24" width="33" height="22" rx="9"/><rect x="9" y="-24" width="33" height="22" rx="9"/><rect x="-11" y="-18" width="22" height="7" rx="3"/><path d="M -22 24 Q 0 42 22 24" fill="none" stroke="#1d3557" stroke-width="8" stroke-linecap="round"/></g>
        <g transform="translate(520,600)"><rect x="-38" y="-22" width="30" height="20" rx="8"/><rect x="8" y="-22" width="30" height="20" rx="8"/><rect x="-10" y="-16" width="20" height="7" rx="3"/><path d="M -18 22 Q 0 38 18 22" fill="none" stroke="#1d3557" stroke-width="8" stroke-linecap="round"/></g>
      </g>
      <!-- wordmark -->
      <text x="520" y="840" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="104" fill="#1d3557" letter-spacing="2">THE PERDIDO PEAS</text>
    </svg>
  </div>
</body>
</html>
