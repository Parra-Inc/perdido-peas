<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      width: 1200px; height: 1200px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: "Baloo 2", sans-serif;
    }
    .diecut {
      filter:
        drop-shadow(16px 0 0 #fff) drop-shadow(-16px 0 0 #fff)
        drop-shadow(0 16px 0 #fff) drop-shadow(0 -16px 0 #fff)
        drop-shadow(0 14px 22px rgba(29,53,87,0.30));
    }
    .stack { display: flex; flex-direction: column; align-items: center; }
    /* speech bubble above the puzzled gull, straight off page 4 */
    .bubble {
      position: relative;
      background: #8fd3ef; color: #1d3557;
      font-weight: 800; font-size: 76px; text-align: center; line-height: 1.05;
      padding: 30px 54px 40px; border-radius: 48px;
      margin-bottom: 46px; transform: rotate(-2deg);
    }
    .bubble::after {
      content: ""; position: absolute; bottom: -34px; left: 56%;
      border: 26px solid transparent; border-top-color: #8fd3ef;
    }
    .gull { height: 560px; width: auto; }
  </style>
</head>
<body>
  <div class="diecut stack">
    <div class="bubble">WHERE IS<br>EVERYBODY?!</div>
    <img class="gull" src="../../public/characters/seagull.svg" alt="Puzzled seagull">
  </div>
</body>
</html>
