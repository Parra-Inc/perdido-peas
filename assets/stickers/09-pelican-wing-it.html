<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      width: 1200px; height: 1200px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: "Baloo 2", sans-serif;
    }
    .diecut {
      filter:
        drop-shadow(16px 0 0 #fff) drop-shadow(-16px 0 0 #fff)
        drop-shadow(0 16px 0 #fff) drop-shadow(0 -16px 0 #fff)
        drop-shadow(0 14px 22px rgba(29,53,87,0.30));
    }
    .stack { display: flex; flex-direction: column; align-items: center; }
    .pelican { height: 660px; width: auto; }
    .line1 {
      color: #1d3557; font-weight: 800; font-size: 112px; line-height: 1; margin-top: 10px;
    }
    .line1 .hl {
      display: inline-block; background: #ffd166; color: #1d3557;
      padding: 0 32px 12px; border-radius: 28px; transform: rotate(-2deg);
    }
  </style>
</head>
<body>
  <div class="diecut stack">
    <img class="pelican" src="../../public/characters/pelican.svg" alt="Pelican">
    <div class="line1">JUST <span class="hl">WING IT</span></div>
  </div>
</body>
</html>
