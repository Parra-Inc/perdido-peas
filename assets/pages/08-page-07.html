<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=2550">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 2550px;
      height: 2550px;
      overflow: hidden;
      position: relative;
      font-family: "Baloo 2", sans-serif;
    }
    .layer { position: absolute; inset: 0; }
    .text-band { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; max-width: 2400px; background: rgba(255,251,240,0.95); border: 10px solid #3b2a21; border-radius: 48px; padding: 48px 88px; box-sizing: border-box; }
    .text-band.top { top: 90px; } .text-band.bottom { bottom: 90px; }
    .text-band p { margin: 0; font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 80px; line-height: 1.4; color: #3b2a21; text-align: center; }
  </style>
</head>
<body>

  <!-- ===================== scene: condo pool, glassy still ===================== -->

    <defs>

        <stop offset="1" stop-color="#cdeef8"/>

        <stop offset="1" stop-color="#5fd6c9"/>

    <g stroke="#3b2a21" stroke-linejoin="round" stroke-linecap="round">

  <!-- ===================== eric peeking over the edge ===================== -->
  <img src="../../public/characters/pages/08-page-07/eric.svg" alt="Eric" style="position: absolute; left: 839px; bottom: 1112px; height: 830px; width: auto;">

  <!-- ===================== crab sunning on the diving board ===================== -->
  <img src="../../public/characters/pages/08-page-07/crab.svg" alt="Crab" style="position: absolute; left: 1880px; bottom: 862px; height: 150px; width: auto;">

  <!-- ===================== text band ===================== -->
  <div class="text-band bottom">
    <p>He peeked at the pool where they'd splash and they'd play,<br>but the pool was as still as a bathtub all day.</p>
  </div>

</body>
</html>
