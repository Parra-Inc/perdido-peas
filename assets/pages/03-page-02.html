<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=2550">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 2550px;
      height: 2550px;
      overflow: hidden;
      position: relative;
      font-family: "Baloo 2", sans-serif;
    }
    .layer { position: absolute; inset: 0; }
    .dream-friend { position: absolute; height: 260px; width: auto; }
    .text-band { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; max-width: 2150px; background: rgba(255,251,240,0.95); border: 10px solid #3b2a21; border-radius: 48px; padding: 48px 88px; box-sizing: border-box; }
    .text-band.top { top: 90px; } .text-band.bottom { bottom: 90px; }
    .text-band p { margin: 0; font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 80px; line-height: 1.4; color: #3b2a21; text-align: center; }
  </style>
</head>
<body>

  <!-- ===================== muted gray-blue classroom, fading behind the dream ===================== -->
  <svg class="layer" viewBox="0 0 2550 2550" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="rainsky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#aebfca"/>
        <stop offset="1" stop-color="#c5d3dc"/>
      </linearGradient>
    </defs>

    <!-- wall + floor -->
    <rect x="0" y="0" width="2550" height="2550" fill="#dfe6ec"/>
    <rect x="0" y="2160" width="2550" height="390" fill="#c9d3da"/>
    <path d="M 0 2160 L 2550 2160" stroke="#a9b6c0" stroke-width="9" fill="none"/>
    <path d="M 260 2300 L 700 2300 M 1350 2260 L 1820 2260 M 2000 2470 L 2480 2470" stroke="#b9c4cc" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- rainy window, top left (the bubble drifts over it) -->
    <g stroke="#3b2a21" stroke-linejoin="round" stroke-linecap="round">
      <rect x="140" y="540" width="430" height="540" rx="16" fill="#c2ccd3" stroke-width="12"/>
      <rect x="176" y="576" width="358" height="468" rx="8" fill="url(#rainsky)" stroke-width="9"/>
      <!-- gray rain cloud outside -->
      <path d="M 240 700 q 20 -40 64 -35 q 18 -32 58 -26 q 40 6 46 39 q 37 6 34 37 q -3 27 -40 28 l -144 0 q -34 -6 -18 -43 Z" fill="#cfd8de" stroke-width="8"/>
      <!-- rain streaks -->
      <g stroke="#8fa3b0" stroke-width="7">
        <path d="M 250 790 L 232 850 M 320 770 L 302 830 M 390 800 L 372 860 M 460 780 L 442 840 M 280 920 L 262 980 M 360 950 L 342 1010 M 440 910 L 422 970"/>
      </g>
      <!-- mullions -->
      <rect x="346" y="576" width="18" height="468" fill="#c2ccd3" stroke-width="6"/>
      <rect x="176" y="800" width="358" height="18" fill="#c2ccd3" stroke-width="6"/>
      <!-- sill -->
      <rect x="118" y="1080" width="474" height="30" rx="10" fill="#c2ccd3" stroke-width="10"/>
    </g>

    <!-- classroom clock, top right -->
    <g stroke="#3b2a21" stroke-linecap="round">
      <circle cx="2330" cy="660" r="105" fill="#eef2f6" stroke-width="12"/>
      <path d="M 2330 575 L 2330 595 M 2330 725 L 2330 745 M 2245 660 L 2265 660 M 2395 660 L 2415 660" stroke="#8fa3b0" stroke-width="8"/>
      <path d="M 2330 660 L 2288 628 M 2330 660 L 2330 596" stroke="#5c6b76" stroke-width="11"/>
      <circle cx="2330" cy="660" r="10" fill="#5c6b76" stroke-width="6"/>
    </g>

    <!-- faded ABC poster on the left wall -->
    <g transform="rotate(-2 275 1605)" stroke="#3b2a21">
      <rect x="140" y="1430" width="270" height="350" rx="12" fill="#edf1f4" stroke-width="9"/>
      <text x="275" y="1590" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="110" fill="#9fb0bc" stroke="none">ABC</text>
      <path d="M 190 1660 q 42 -16 85 0 q 42 16 85 0" fill="none" stroke="#b9c4cc" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- stack of books on the floor, bottom right -->
    <g stroke="#3b2a21" stroke-width="10" stroke-linejoin="round">
      <rect x="2140" y="2400" width="300" height="62" rx="10" fill="#9fb0bc"/>
      <rect x="2162" y="2340" width="258" height="62" rx="10" fill="#b5aec8"/>
      <rect x="2186" y="2280" width="216" height="62" rx="10" fill="#a9bfb2"/>
    </g>
  </svg>

  <!-- ===================== the huge dream bubble: sunny perdido key inside ===================== -->
  <svg class="layer" viewBox="0 0 2550 2550" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="dreamsky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fd3ef"/>
        <stop offset="1" stop-color="#cdeef8"/>
      </linearGradient>
      <linearGradient id="dreamgulf" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2ec4b6"/>
        <stop offset="1" stop-color="#5fd6c9"/>
      </linearGradient>
      <clipPath id="bubbleClip">
        <path d="M 2344.2 1317.9 A 160.8 160.8 0 0 1 2226.0 1568.6 A 174.1 174.1 0 0 1 2005.8 1772.6 A 187.9 187.9 0 0 1 1710.1 1905.0 A 196.3 196.3 0 0 1 1374.6 1950.0 A 196.2 196.2 0 0 1 1039.8 1902.1 A 187.5 187.5 0 0 1 746.0 1767.1 A 173.6 173.6 0 0 1 528.6 1561.3 A 160.5 160.5 0 0 1 414.0 1309.6 A 155.1 155.1 0 0 1 415.8 1042.1 A 160.8 160.8 0 0 1 534.0 791.4 A 174.1 174.1 0 0 1 754.2 587.4 A 187.9 187.9 0 0 1 1049.9 455.0 A 196.3 196.3 0 0 1 1385.4 410.0 A 196.2 196.2 0 0 1 1720.2 457.9 A 187.5 187.5 0 0 1 2014.0 592.9 A 173.6 173.6 0 0 1 2231.4 798.7 A 160.5 160.5 0 0 1 2346.0 1050.4 A 155.1 155.1 0 0 1 2344.2 1317.9 Z"/>
      </clipPath>
    </defs>

    <!-- thought-bubble tail puffs rising from eric -->
    <circle cx="690" cy="2210" r="28" fill="#ffffff" stroke="#3b2a21" stroke-width="11"/>
    <circle cx="810" cy="2080" r="45" fill="#ffffff" stroke="#3b2a21" stroke-width="12"/>

    <!-- white cloud base -->
    <path d="M 2344.2 1317.9 A 160.8 160.8 0 0 1 2226.0 1568.6 A 174.1 174.1 0 0 1 2005.8 1772.6 A 187.9 187.9 0 0 1 1710.1 1905.0 A 196.3 196.3 0 0 1 1374.6 1950.0 A 196.2 196.2 0 0 1 1039.8 1902.1 A 187.5 187.5 0 0 1 746.0 1767.1 A 173.6 173.6 0 0 1 528.6 1561.3 A 160.5 160.5 0 0 1 414.0 1309.6 A 155.1 155.1 0 0 1 415.8 1042.1 A 160.8 160.8 0 0 1 534.0 791.4 A 174.1 174.1 0 0 1 754.2 587.4 A 187.9 187.9 0 0 1 1049.9 455.0 A 196.3 196.3 0 0 1 1385.4 410.0 A 196.2 196.2 0 0 1 1720.2 457.9 A 187.5 187.5 0 0 1 2014.0 592.9 A 173.6 173.6 0 0 1 2231.4 798.7 A 160.5 160.5 0 0 1 2346.0 1050.4 A 155.1 155.1 0 0 1 2344.2 1317.9 Z" fill="#ffffff"/>

    <!-- ============ the dream: bright perdido key ============ -->
    <g clip-path="url(#bubbleClip)">
      <!-- sky -->
      <rect x="300" y="300" width="2160" height="765" fill="url(#dreamsky)"/>

      <!-- sun -->
      <g stroke="#3b2a21" stroke-width="10" stroke-linecap="round">
        <circle cx="860" cy="690" r="80" fill="#ffb703"/>
        <path d="M 860 578 L 860 548 M 860 802 L 860 832 M 748 690 L 718 690 M 972 690 L 1002 690
                 M 781 611 L 760 590 M 939 611 L 960 590 M 781 769 L 760 790 M 939 769 L 960 790" fill="none"/>
      </g>

      <!-- puffy cloud -->
      <path d="M 1880 720 q 25 -50 80 -44 q 22 -40 72 -32 q 50 7 57 49 q 46 7 42 46 q -4 34 -50 35 l -180 0 q -42 -7 -21 -54 Z" fill="#ffffff" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" opacity="0.95"/>

      <!-- gulls -->
      <g transform="translate(1620 590) scale(0.75)" fill="#ffffff" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
        <path d="M 0 30 Q 40 10 78 26 Q 110 -14 148 6 Q 128 34 96 44 Q 60 56 22 48 Q 4 44 0 30 Z"/>
        <path d="M 60 30 Q 90 -30 140 -34 Q 118 6 92 22" fill="#c9ced4"/>
        <path d="M 148 6 L 176 14 L 150 24" fill="#ffb703" stroke-width="7"/>
      </g>
      <g transform="translate(1180 800) scale(0.55)" fill="#ffffff" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
        <path d="M 0 30 Q 40 10 78 26 Q 110 -14 148 6 Q 128 34 96 44 Q 60 56 22 48 Q 4 44 0 30 Z"/>
        <path d="M 60 30 Q 90 -30 140 -34 Q 118 6 92 22" fill="#c9ced4"/>
        <path d="M 148 6 L 176 14 L 150 24" fill="#ffb703" stroke-width="7"/>
      </g>

      <!-- clear turquoise water -->
      <rect x="300" y="1060" width="2160" height="480" fill="url(#dreamgulf)"/>
      <path d="M 300 1060 q 55 -15 110 0 q 55 15 110 0 q 55 -15 110 0 q 55 15 110 0 q 55 -15 110 0 q 55 15 110 0 q 55 -15 110 0 q 55 15 110 0 q 55 -15 110 0 q 55 15 110 0 q 55 -15 110 0 q 55 15 110 0 q 55 -15 110 0 q 55 15 110 0 q 55 -15 110 0 q 55 15 110 0 q 55 -15 110 0 q 55 15 110 0 q 55 -15 110 0 q 55 15 110 0 L 2500 1120 L 300 1120 Z" fill="#2ec4b6"/>
      <g stroke="#bff0ea" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M 700 1160 q 45 -14 90 0 M 1350 1130 q 45 -14 90 0 M 1900 1170 q 45 -14 90 0 M 560 1300 q 45 -14 90 0 M 1150 1280 q 45 -14 90 0 M 1750 1300 q 45 -14 90 0 M 900 1420 q 45 -14 90 0 M 1500 1440 q 45 -14 90 0 M 2050 1420 q 45 -14 90 0"/>
      </g>

      <!-- foam where the waves kiss the sand -->
      <path d="M 300 1520 q 60 -22 120 0 q 60 22 120 0 q 60 -22 120 0 q 60 22 120 0 q 60 -22 120 0 q 60 22 120 0 q 60 -22 120 0 q 60 22 120 0 q 60 -22 120 0 q 60 22 120 0 q 60 -22 120 0 q 60 22 120 0 q 60 -22 120 0 q 60 22 120 0 q 60 -22 120 0 q 60 22 120 0 q 60 -22 120 0 q 60 22 120 0 L 2460 1520 L 2460 1548 L 300 1548 Z" fill="#ffffff" opacity="0.95"/>

      <!-- sugar-white sand -->
      <rect x="300" y="1540" width="2160" height="420" fill="#fdf6e3"/>
      <g stroke="#efe3c4" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M 700 1720 q 70 -18 140 0 M 1450 1755 q 70 -18 140 0 M 1020 1875 q 60 -16 120 0 M 1950 1690 q 60 -16 120 0"/>
      </g>

      <!-- little foam swirls around the crab in the surf -->
      <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.95">
        <path d="M 448 1462 q 50 -16 100 0 M 560 1492 q 45 14 90 0"/>
      </g>

      <!-- beach umbrella, left -->
      <g stroke="#3b2a21" stroke-linejoin="round" stroke-linecap="round">
        <rect x="527" y="1360" width="16" height="240" rx="8" fill="#8a6f52" stroke-width="8"/>
        <path d="M 405 1380 Q 535 1245 665 1380 q -32 -18 -65 0 q -32 -18 -65 0 q -32 -18 -65 0 q -32 -18 -65 0 Z" fill="#ef6f6c" stroke-width="10"/>
        <path d="M 535 1314 Q 499 1341 485 1379 L 585 1379 Q 571 1341 535 1314 Z" fill="#faf6ee" stroke-width="7"/>
        <circle cx="535" cy="1306" r="10" fill="#ffb703" stroke-width="7"/>
      </g>

      <!-- beach umbrella, right -->
      <g stroke="#3b2a21" stroke-linejoin="round" stroke-linecap="round">
        <rect x="2112" y="1300" width="18" height="270" rx="9" fill="#8a6f52" stroke-width="8"/>
        <path d="M 1955 1330 Q 2120 1178 2285 1330 q -33 -20 -66 0 q -33 -20 -66 0 q -33 -20 -66 0 q -33 -20 -66 0 q -33 -20 -66 0 Z" fill="#ffb703" stroke-width="10"/>
        <path d="M 2120 1256 Q 2078 1287 2060 1329 L 2180 1329 Q 2162 1287 2120 1256 Z" fill="#faf6ee" stroke-width="7"/>
        <circle cx="2120" cy="1247" r="10" fill="#ef6f6c" stroke-width="7"/>
      </g>

      <!-- coral beach ball on the sand -->
      <circle cx="1650" cy="1790" r="60" fill="#ef6f6c" stroke="#3b2a21" stroke-width="10"/>
      <path d="M 1602 1764 Q 1650 1736 1698 1764 M 1602 1816 Q 1650 1844 1698 1816" fill="none" stroke="#3b2a21" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- scalloped cloud outline -->
    <path d="M 2344.2 1317.9 A 160.8 160.8 0 0 1 2226.0 1568.6 A 174.1 174.1 0 0 1 2005.8 1772.6 A 187.9 187.9 0 0 1 1710.1 1905.0 A 196.3 196.3 0 0 1 1374.6 1950.0 A 196.2 196.2 0 0 1 1039.8 1902.1 A 187.5 187.5 0 0 1 746.0 1767.1 A 173.6 173.6 0 0 1 528.6 1561.3 A 160.5 160.5 0 0 1 414.0 1309.6 A 155.1 155.1 0 0 1 415.8 1042.1 A 160.8 160.8 0 0 1 534.0 791.4 A 174.1 174.1 0 0 1 754.2 587.4 A 187.9 187.9 0 0 1 1049.9 455.0 A 196.3 196.3 0 0 1 1385.4 410.0 A 196.2 196.2 0 0 1 1720.2 457.9 A 187.5 187.5 0 0 1 2014.0 592.9 A 173.6 173.6 0 0 1 2231.4 798.7 A 160.5 160.5 0 0 1 2346.0 1050.4 A 155.1 155.1 0 0 1 2344.2 1317.9 Z" fill="none" stroke="#3b2a21" stroke-width="14" stroke-linejoin="round"/>
  </svg>

  <!-- ===================== the six buddies, tiny and happy in the dream surf ===================== -->
  <img class="dream-friend" src="../../public/characters/ian.svg"   alt="Ian"   style="left: 645px;  bottom: 930px;">
  <img class="dream-friend" src="../../public/characters/katie.svg" alt="Katie" style="left: 880px;  bottom: 885px;">
  <img class="dream-friend" src="../../public/characters/chris.svg" alt="Chris" style="left: 1110px; bottom: 930px;">
  <img class="dream-friend" src="../../public/characters/grace.svg" alt="Grace" style="left: 1340px; bottom: 875px;">
  <img class="dream-friend" src="../../public/characters/ben.svg"   alt="Ben"   style="left: 1575px; bottom: 925px;">
  <img class="dream-friend" src="../../public/characters/sarah.svg" alt="Sarah" style="left: 1790px; bottom: 880px;">

  <!-- the hidden crab, splashing in the dream surf -->
  <img src="../../public/characters/crab.svg" alt="Crab" style="position: absolute; left: 500px; bottom: 1070px; height: 115px; width: auto;">

  <!-- ===================== eric, glowing up at his daydream ===================== -->
  <img src="../../public/characters/pages/03-page-02/eric-dreaming.svg" alt="Eric" style="position: absolute; left: -140px; bottom: -280px; height: 1250px; width: auto;">

  <!-- school desk in front of eric -->
  <svg class="layer" viewBox="0 0 2550 2550" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#3b2a21" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-40" y="2318" width="1090" height="76" rx="16" fill="#b79975" stroke-width="12"/>
      <path d="M 20 2356 L 990 2356" stroke="#9c8266" stroke-width="6"/>
      <rect x="-40" y="2388" width="1090" height="200" rx="12" fill="#a98c69" stroke-width="12"/>
      <!-- daydream doodle page -->
      <g transform="rotate(-4 600 2354)">
        <rect x="470" y="2322" width="260" height="64" rx="8" fill="#fbfbf8" stroke-width="8"/>
        <path d="M 500 2344 q 22 -10 44 0 q 22 10 44 0 M 610 2344 q 22 -10 44 0 M 500 2368 L 700 2368" fill="none" stroke="#9fb0bc" stroke-width="5"/>
      </g>
      <!-- pencil -->
      <g transform="rotate(9 850 2352)">
        <rect x="770" y="2342" width="160" height="21" rx="5" fill="#ffb703" stroke-width="8"/>
        <path d="M 930 2342 L 963 2352 L 930 2363 Z" fill="#f6dec6" stroke-width="7"/>
        <circle cx="960" cy="2352" r="4" fill="#3b2a21" stroke="none"/>
        <rect x="748" y="2342" width="22" height="21" rx="7" fill="#e88ba8" stroke-width="7"/>
      </g>
    </g>
  </svg>

  <!-- ===================== the rhyme ===================== -->
  <div class="text-band top"><p>He dreamed of Perdido, where the water's so clear,<br>with sugar-white sand and his best buddies near.</p></div>

</body>
</html>
