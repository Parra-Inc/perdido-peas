  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 2550px;
      height: 2550px;
      overflow: hidden;
      position: relative;
      font-family: "Baloo 2", sans-serif;
    }
    .layer { position: absolute; inset: 0; }
    .vignette {
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
    }
    .vignette svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .vignette img { position: absolute; width: auto; display: block; }
    .cropwrap { position: absolute; overflow: hidden; }
    .cropwrap img { position: absolute; left: 0; top: 0; }
    .text-band { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; max-width: 2150px; background: rgba(255,251,240,0.95); border: 10px solid #3b2a21; border-radius: 48px; padding: 48px 88px; box-sizing: border-box; }
    .text-band.top { top: 90px; } .text-band.bottom { bottom: 90px; }
    .text-band p { margin: 0; font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 80px; line-height: 1.4; color: #3b2a21; text-align: center; }
  </style>

  <div class="text-band bottom"><p>They floated in waves and played bocce on sand,<br>and danced to the tunes of the Flora-Bama band.</p></div>
