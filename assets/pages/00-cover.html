<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=2550">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 2550px;
      height: 2550px;
      overflow: hidden;
      position: relative;
      font-family: "Baloo 2", sans-serif;
    }
    .layer { position: absolute; inset: 0; }
    .friend { position: absolute; height: 707px; width: auto; }
  </style>
</head>
<body>

  <!-- ===================== scene: sky, sun, water, sand, flora-bama ===================== -->
  <svg class="layer" viewBox="0 0 2550 2550" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fd3ef"/>
        <stop offset="1" stop-color="#cdeef8"/>
      </linearGradient>
      <linearGradient id="gulf" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2ec4b6"/>
        <stop offset="1" stop-color="#5fd6c9"/>
      </linearGradient>
    </defs>

    <!-- sky -->
    <rect x="0" y="0" width="2550" height="1600" fill="url(#sky)"/>

    <!-- sun, top left -->
    <g stroke="#3b2a21" stroke-width="10" stroke-linecap="round">
      <circle cx="260" cy="270" r="120" fill="#ffb703"/>
      <path d="M 260 90 L 260 40 M 260 450 L 260 500 M 80 270 L 30 270 M 440 270 L 490 270
               M 133 143 L 98 108 M 387 143 L 422 108 M 133 397 L 98 432 M 387 397 L 422 432" fill="none"/>
    </g>

    <!-- puffy clouds -->
    <g fill="#ffffff" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" opacity="0.95">
      <path d="M 2050 250 q 30 -60 95 -52 q 25 -48 85 -38 q 60 8 68 58 q 55 8 50 55 q -5 40 -60 42 l -215 0 q -50 -8 -23 -65 Z"/>
      <path d="M 480 720 q 25 -50 80 -44 q 22 -40 72 -32 q 50 7 57 49 q 46 7 42 46 q -4 34 -50 35 l -180 0 q -42 -7 -21 -54 Z"/>
    </g>

    <!-- gulls overhead -->
    <g fill="#ffffff" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <g transform="translate(2120 640)">
        <path d="M 0 30 Q 40 10 78 26 Q 110 -14 148 6 Q 128 34 96 44 Q 60 56 22 48 Q 4 44 0 30 Z"/>
        <path d="M 60 30 Q 90 -30 140 -34 Q 118 6 92 22" fill="#c9ced4"/>
        <path d="M 148 6 L 176 14 L 150 24" fill="#ffb703" stroke-width="7"/>
      </g>
      <g transform="translate(320 980) scale(0.8)">
        <path d="M 0 30 Q 40 10 78 26 Q 110 -14 148 6 Q 128 34 96 44 Q 60 56 22 48 Q 4 44 0 30 Z"/>
        <path d="M 60 30 Q 90 -30 140 -34 Q 118 6 92 22" fill="#c9ced4"/>
        <path d="M 148 6 L 176 14 L 150 24" fill="#ffb703" stroke-width="7"/>
      </g>
    </g>

    <!-- emerald gulf at the horizon -->
    <rect x="0" y="1560" width="2550" height="260" fill="url(#gulf)"/>
    <path d="M 0 1560 q 60 -18 120 0 q 60 18 120 0 q 60 -18 120 0 q 60 18 120 0 q 60 -18 120 0 q 60 18 120 0 q 60 -18 120 0 q 60 18 120 0 q 60 -18 120 0 q 60 18 120 0 q 60 -18 120 0 q 60 18 120 0 q 60 -18 120 0 q 60 18 120 0 q 60 -18 120 0 q 60 18 120 0 q 60 -18 120 0 q 60 18 120 0 q 60 -18 120 0 q 60 18 120 0 q 60 -18 120 0 L 2550 1620 L 0 1620 Z" fill="#2ec4b6"/>
    <g stroke="#bff0ea" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M 180 1660 q 45 -14 90 0 M 620 1700 q 45 -14 90 0 M 1120 1650 q 45 -14 90 0 M 1720 1695 q 45 -14 90 0 M 2260 1655 q 45 -14 90 0"/>
    </g>

    <!-- foam edge where waves meet the sand -->
    <path d="M 0 1790 q 70 -26 140 0 q 70 26 140 0 q 70 -26 140 0 q 70 26 140 0 q 70 -26 140 0 q 70 26 140 0 q 70 -26 140 0 q 70 26 140 0 q 70 -26 140 0 q 70 26 140 0 q 70 -26 140 0 q 70 26 140 0 q 70 -26 140 0 q 70 26 140 0 q 70 -26 140 0 q 70 26 140 0 q 70 -26 140 0 q 70 26 140 0 L 2550 1790 L 2550 1820 L 0 1820 Z" fill="#ffffff" opacity="0.95"/>

    <!-- sugar-white sand -->
    <rect x="0" y="1810" width="2550" height="740" fill="#fdf6e3"/>
    <g stroke="#efe3c4" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M 190 2030 q 90 -22 180 0 M 950 2110 q 90 -22 180 0 M 2130 2050 q 90 -22 180 0 M 520 2400 q 90 -22 180 0 M 1850 2430 q 90 -22 180 0"/>
    </g>

    <!-- ===================== the flora-bama ===================== -->
    <g stroke="#3b2a21" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 140)">

      <!-- stilt posts under the deck -->
      <g fill="#8a6f52" stroke-width="9">
        <rect x="640" y="1810" width="34" height="120" rx="8"/>
        <rect x="980" y="1810" width="34" height="130" rx="8"/>
        <rect x="1540" y="1810" width="34" height="130" rx="8"/>
        <rect x="1880" y="1810" width="34" height="120" rx="8"/>
      </g>

      <!-- main weathered-wood facade -->
      <rect x="560" y="1330" width="1430" height="520" rx="14" fill="#b79975" stroke-width="12"/>
      <!-- plank lines -->
      <g stroke="#9c8266" stroke-width="6" opacity="0.85">
        <path d="M 700 1340 L 700 1840 M 840 1340 L 840 1840 M 980 1340 L 980 1840 M 1120 1340 L 1120 1840 M 1260 1340 L 1260 1840 M 1400 1340 L 1400 1840 M 1540 1340 L 1540 1840 M 1680 1340 L 1680 1840 M 1820 1340 L 1820 1840"/>
      </g>

      <!-- side wing, left -->
      <rect x="420" y="1500" width="180" height="350" rx="12" fill="#a98c69" stroke-width="10"/>
      <path d="M 390 1512 L 510 1420 L 630 1512 Z" fill="#aab7bd" stroke-width="10"/>

      <!-- side wing, right -->
      <rect x="1950" y="1500" width="180" height="350" rx="12" fill="#a98c69" stroke-width="10"/>
      <path d="M 1920 1512 L 2040 1420 L 2160 1512 Z" fill="#aab7bd" stroke-width="10"/>

      <!-- main tin roof -->
      <path d="M 520 1340 L 1275 1200 L 2030 1340 L 2030 1385 L 520 1385 Z" fill="#c3ced4" stroke-width="12"/>
      <g stroke="#93a3ab" stroke-width="6" fill="none">
        <path d="M 700 1352 L 700 1378 M 880 1330 L 880 1378 M 1060 1308 L 1060 1378 M 1275 1290 L 1275 1378 M 1490 1308 L 1490 1378 M 1670 1330 L 1670 1378 M 1850 1352 L 1850 1378"/>
      </g>

      <!-- upper story + second tin roof -->
      <rect x="940" y="1120" width="670" height="120" rx="10" fill="#a98c69" stroke-width="10"/>
      <path d="M 900 1130 L 1275 1050 L 1650 1130 L 1650 1165 L 900 1165 Z" fill="#c3ced4" stroke-width="10"/>

      <!-- big FLORA-BAMA sign -->
      <g>
        <rect x="905" y="880" width="740" height="180" rx="20" fill="#f2ede0" stroke-width="12"/>
        <rect x="925" y="900" width="700" height="140" rx="12" fill="none" stroke="#ef6f6c" stroke-width="7"/>
        <rect x="1240" y="1050" width="26" height="80" fill="#8a6f52" stroke-width="8"/>
        <rect x="1310" y="1050" width="26" height="80" fill="#8a6f52" stroke-width="8"/>
        <text x="1275" y="1012" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="104" fill="#1d3557" stroke="none" letter-spacing="4">FLORA-BAMA</text>
      </g>

      <!-- windows -->
      <g fill="#8ed8ef" stroke-width="9">
        <rect x="660" y="1470" width="130" height="130" rx="10"/>
        <rect x="1760" y="1470" width="130" height="130" rx="10"/>
        <rect x="1060" y="1150" width="90" height="70" rx="8"/>
        <rect x="1400" y="1150" width="90" height="70" rx="8"/>
      </g>
      <g stroke="#3b2a21" stroke-width="6" fill="none">
        <path d="M 725 1470 L 725 1600 M 660 1535 L 790 1535 M 1825 1470 L 1825 1600 M 1760 1535 L 1890 1535"/>
      </g>

      <!-- swinging saloon door -->
      <rect x="1180" y="1590" width="190" height="260" rx="14" fill="#7d6248" stroke-width="10"/>
      <path d="M 1275 1590 L 1275 1850 M 1200 1660 L 1350 1660" stroke="#3b2a21" stroke-width="6" fill="none"/>
      <circle cx="1250" cy="1730" r="9" fill="#ffb703" stroke-width="6"/>
      <circle cx="1300" cy="1730" r="9" fill="#ffb703" stroke-width="6"/>

      <!-- license plates on the wall -->
      <g stroke-width="6">
        <rect x="870" y="1450" width="88" height="48" rx="8" fill="#ef6f6c" transform="rotate(-4 914 1474)"/>
        <rect x="990" y="1440" width="88" height="48" rx="8" fill="#ffb703" transform="rotate(3 1034 1464)"/>
        <rect x="1470" y="1445" width="88" height="48" rx="8" fill="#2ec4b6" transform="rotate(-3 1514 1469)"/>
        <rect x="1590" y="1455" width="88" height="48" rx="8" fill="#8ed8ef" transform="rotate(4 1634 1479)"/>
        <rect x="1110" y="1460" width="88" height="48" rx="8" fill="#f2ede0" transform="rotate(-2 1154 1484)"/>
      </g>

      <!-- string lights across the facade -->
      <g fill="none" stroke="#3b2a21" stroke-width="6">
        <path d="M 570 1400 Q 920 1500 1275 1470 Q 1630 1500 1980 1400"/>
      </g>
      <g fill="#ffd94a" stroke="#3b2a21" stroke-width="5">
        <circle cx="700" cy="1442" r="14"/>
        <circle cx="850" cy="1468" r="14"/>
        <circle cx="1000" cy="1482" r="14"/>
        <circle cx="1150" cy="1477" r="14"/>
        <circle cx="1275" cy="1470" r="14"/>
        <circle cx="1400" cy="1477" r="14"/>
        <circle cx="1550" cy="1482" r="14"/>
        <circle cx="1700" cy="1468" r="14"/>
        <circle cx="1850" cy="1442" r="14"/>
      </g>

      <!-- music notes drifting out -->
      <g fill="#3b2a21" stroke="#3b2a21" stroke-width="7">
        <g transform="translate(2200 1240) rotate(12)">
          <ellipse cx="0" cy="30" rx="16" ry="12"/>
          <path d="M 14 28 L 14 -30 Q 34 -26 44 -10" fill="none"/>
        </g>
        <g transform="translate(360 1330) rotate(-10) scale(0.85)">
          <ellipse cx="0" cy="30" rx="16" ry="12"/>
          <path d="M 14 28 L 14 -30 Q 34 -26 44 -10" fill="none"/>
        </g>
      </g>
    </g>
  </svg>

  <!-- ===================== the peas, holding hands ===================== -->
  <!-- holding-pose variants (arms rotated at the shoulder); feet share the sand line,
       spacing tuned so every pair of mitten hands clasps at the same height -->
  <img class="friend" src="../../public/characters/holding/ian.svg"   alt="Ian"   style="left: 148px;  bottom: 90px;">
  <img class="friend" src="../../public/characters/holding/katie.svg" alt="Katie" style="left: 433px;  bottom: 90px;">
  <img class="friend" src="../../public/characters/holding/chris.svg" alt="Chris" style="left: 715px;  bottom: 90px;">
  <img class="friend" src="../../public/characters/holding/grace.svg" alt="Grace" style="left: 1010px; bottom: 90px;">
  <img class="friend" src="../../public/characters/holding/ben.svg"   alt="Ben"   style="left: 1291px; bottom: 90px;">
  <img class="friend" src="../../public/characters/holding/sarah.svg" alt="Sarah" style="left: 1572px; bottom: 90px;">
  <img class="friend" src="../../public/characters/holding/eric.svg"  alt="Eric"  style="left: 1853px; bottom: 90px; height: 757px;">

  <!-- ===================== crab peeking from behind a bocce ball ===================== -->
  <img src="../../public/characters/crab.svg" alt="Crab" style="position: absolute; left: 96px; bottom: 208px; height: 170px; width: auto;">
  <svg style="position: absolute; left: 40px; bottom: 60px; width: 220px; height: 220px;" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <circle cx="110" cy="110" r="96" fill="#ef6f6c" stroke="#3b2a21" stroke-width="10"/>
    <path d="M 40 80 Q 110 40 180 80 M 40 140 Q 110 180 180 140" fill="none" stroke="#3b2a21" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </svg>

  <!-- ===================== yellow bocce ball next to eric ===================== -->
  <svg style="position: absolute; right: 105px; bottom: 80px; width: 110px; height: 110px;" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <circle cx="110" cy="110" r="96" fill="#ffb703" stroke="#3b2a21" stroke-width="14"/>
    <!-- sand mound burying the bottom of the ball -->
    <path d="M -10 160 Q 40 138 90 152 Q 140 166 180 150 Q 210 140 230 152 L 230 230 L -10 230 Z" fill="#fdf6e3"/>
    <path d="M -10 160 Q 40 138 90 152 Q 140 166 180 150 Q 210 140 230 152" fill="none" stroke="#efe3c4" stroke-width="9" stroke-linecap="round"/>
  </svg>

  <!-- ===================== title in the sky ===================== -->
  <svg class="layer" viewBox="0 0 2550 2550" xmlns="http://www.w3.org/2000/svg">
    <g font-family="'Baloo 2', sans-serif" font-weight="800" text-anchor="middle">
      <!-- coral sticker shadow -->
      <g fill="#ef6f6c" stroke="#3b2a21" stroke-width="30" stroke-linejoin="round" paint-order="stroke" transform="translate(14 18)">
        <text x="1275" y="430" font-size="300" letter-spacing="10"
              dy="0 16 -28 26 -28 26 -22" rotate="-4 3 -3 4 -4 3 -3">PERDIDO</text>
        <text x="1275" y="790" font-size="400" letter-spacing="14"
              dy="0 20 -36 32" rotate="-4 4 -3 4">PEAS</text>
      </g>
      <!-- sunshine main letters -->
      <g fill="#ffb703" stroke="#3b2a21" stroke-width="18" stroke-linejoin="round" paint-order="stroke">
        <text x="1275" y="430" font-size="300" letter-spacing="10"
              dy="0 16 -28 26 -28 26 -22" rotate="-4 3 -3 4 -4 3 -3">PERDIDO</text>
        <text x="1275" y="790" font-size="400" letter-spacing="14"
              dy="0 20 -36 32" rotate="-4 4 -3 4">PEAS</text>
      </g>
      <!-- byline -->
      <text x="1275" y="700" font-size="0"> </text>
      <text x="1275" y="948" font-size="66" font-weight="700" fill="#1d3557">by Ian MacCallum and Katie Rivas</text>
    </g>
  </svg>

</body>
</html>
