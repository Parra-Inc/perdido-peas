# Deploys the Perdido Peas site (web/) to Cloudflare Workers (OpenNext).
#
# The Next.js app lives in web/ and uses npm. Auth uses the Parra-Inc org-level
# CLOUDFLARE_API_TOKEN secret (Workers Scripts:Edit) and CLOUDFLARE_ACCOUNT_ID
# variable. Static site: no runtime secrets.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Next.js + OpenNext)
        run: pnpm run build:cf

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
