      <rect x="250" y="640" width="36" height="88" rx="17" fill="#f7dcc0"/>
      <rect x="314" y="640" width="36" height="88" rx="17" fill="#f7dcc0"/>
      <!-- flip-flops -->
      <ellipse cx="268" cy="738" rx="30" ry="13" fill="#f7dcc0"/>
      <ellipse cx="332" cy="738" rx="30" ry="13" fill="#f7dcc0"/>
      <!-- shorts -->
      <path d="M 240 588 L 360 588 L 364 656 Q 365 672 350 672 L 314 672 Q 305 672 303 662 Q 301 654 300 654 Q 299 654 297 662 Q 295 672 286 672 L 250 672 Q 235 672 236 656 Z" fill="#bfe3c5"/>
    </g>

    <!-- arms -->
    <g transform="rotate(-105 380 490)">
    <path d="M 372 484 Q 398 492 409 520 Q 420 548 422 570 Q 423 588 412 592 Q 400 594 395 580 Q 389 565 388 540 Q 386 506 372 484 Z" fill="#f7dcc0" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="414" cy="601" rx="23" ry="26" transform="rotate(-8 414 601)" fill="#f7dcc0" stroke="#3b2a21" stroke-width="9"/>
    </g>
    <g transform="rotate(115 220 490)">
    <path d="M 228 484 Q 202 492 191 520 Q 180 548 178 570 Q 177 588 188 592 Q 200 594 205 580 Q 211 565 212 540 Q 214 506 228 484 Z" fill="#f7dcc0" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="186" cy="601" rx="23" ry="26" transform="rotate(8 186 601)" fill="#f7dcc0" stroke="#3b2a21" stroke-width="9"/>
    </g>

    <g stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <!-- tee -->
      <path d="M 300 382 Q 272 384 255 393 Q 222 400 205 418 Q 188 448 185 500 Q 190 512 205 508 Q 224 504 238 496 L 232 598 Q 268 606 300 606 Q 332 606 368 598 L 362 496 Q 376 504 395 508 Q 410 512 415 500 Q 412 448 395 418 Q 378 400 345 393 Q 328 384 300 382 Z" fill="#cbb8e8"/>
      <path d="M 262 394 Q 300 420 338 394" fill="none" stroke-width="6"/>

      <!-- neck, ears, head -->
      <rect x="278" y="360" width="44" height="48" rx="12" fill="#f7dcc0"/>
      <circle cx="142" cy="274" r="16" fill="#f7dcc0"/>
      <circle cx="458" cy="274" r="16" fill="#f7dcc0"/>
      <ellipse cx="300" cy="252" rx="150" ry="145" fill="#f7dcc0"/>
    </g>


    <!-- face (shifted down slightly to clear the hat brim) -->
    <ellipse cx="206" cy="308" rx="20" ry="12" fill="#f2937b" opacity="0.45"/>
    <ellipse cx="394" cy="308" rx="20" ry="12" fill="#f2937b" opacity="0.45"/>
    <ellipse cx="300" cy="308" rx="14" ry="11" fill="#e7c3a0" stroke="#3b2a21" stroke-width="7"/>
    <path d="M 266 334 Q 300 342 334 334 Q 330 368 300 372 Q 270 368 266 334 Z" fill="#4a2b22" stroke="#3b2a21" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 272 340 Q 300 346 328 340 Q 326 353 300 356 Q 274 353 272 340 Z" fill="#ffffff"/>
    <path d="M 264 332 q -8 -2 -12 -9 M 336 332 q 8 -2 12 -9" fill="none" stroke="#3b2a21" stroke-width="6" stroke-linecap="round"/>

    <!-- blue eyes with lashes -->
    <circle cx="258" cy="274" r="13" fill="#4a90d9"/>
    <circle cx="342" cy="274" r="13" fill="#4a90d9"/>
    <circle cx="258" cy="274" r="6" fill="#26211d"/>
    <circle cx="342" cy="274" r="6" fill="#26211d"/>
    <circle cx="262" cy="269" r="4" fill="#ffffff"/>
    <circle cx="346" cy="269" r="4" fill="#ffffff"/>
    <path d="M 247 264 L 240 256 M 253 261 L 249 252" fill="none" stroke="#3b2a21" stroke-width="4" stroke-linecap="round"/>
    <path d="M 353 264 L 360 256 M 347 261 L 351 252" fill="none" stroke="#3b2a21" stroke-width="4" stroke-linecap="round"/>
    <path d="M 236 248 Q 258 239 280 247 M 320 247 Q 342 239 364 248" fill="none" stroke="#8a6f45" stroke-width="7" stroke-linecap="round"/>

    <!-- white Flora-Bama bucket hat: bigger, sitting higher on the head -->
    <path d="M 164 186 Q 160 80 206 72 Q 300 56 394 72 Q 440 80 436 186 Z" fill="#faf6ee" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 120 186 Q 300 160 480 186 Q 500 192 496 212 Q 470 240 300 246 Q 130 240 104 212 Q 100 192 120 186 Z" fill="#faf6ee" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 170 174 Q 300 154 430 174" fill="none" stroke="#e5dbc8" stroke-width="5" stroke-linecap="round"/>
    <text x="300" y="148" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="24" letter-spacing="2" fill="#e2574c">FLORA-BAMA</text>
  </g>
</svg>
