<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Grace: pale, short brownish-blonde hair, white Flora-Bama bucket hat -->
  <g transform="translate(36 90.24) scale(0.88)">

    <!-- wavy brownish-blonde hair falling BEHIND the back: top edge cut off just above the hat's bottom -->
    <path d="M 160 218
             L 440 218
             Q 462 222 464 240
             Q 482 278 468 318
             Q 454 350 470 388
             Q 482 420 464 450
             Q 450 468 430 460
             Q 370 472 300 472
             Q 230 472 170 460
             Q 150 468 136 450
             Q 118 420 130 388
             Q 146 350 132 318
             Q 118 278 136 238
             Q 138 222 160 218 Z" fill="#c2a36b" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 461 226 Q 459 254 454 280 Q 442 322 458 364 M 139 226 Q 141 254 146 280 Q 158 322 142 364" fill="none" stroke="#a5854e" stroke-width="6" stroke-linecap="round"/>
    <path d="M 464 320 Q 452 370 466 412 Q 472 438 456 452 M 136 320 Q 148 370 134 412 Q 128 438 144 452" fill="none" stroke="#a5854e" stroke-width="6" stroke-linecap="round"/>
    <path d="M 447 226 Q 441 274 450 320 M 153 226 Q 159 274 150 320" fill="none" stroke="#d4bc8c" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <g stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
