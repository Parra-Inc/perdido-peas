<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Eric, lonely walking pose (page 8): full side profile facing RIGHT, head hung low,
       near hand tucked into his shorts pocket, mid-stride. The cap is BACKWARDS, so in
       profile the bill points FULLY BEHIND him (to the left). Same palette and thick
       rounded outlines as the stock front-facing Eric. -->

  <!-- cap bill: backwards, pointing fully behind him (drawn first, tucked under the head) -->
  <path d="M 195 234 Q 88 228 72 250 Q 64 272 80 284 Q 98 292 195 282 Z"
        fill="#283349" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>

  <g stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- back leg, trailing the stride -->
    <g transform="rotate(22 268 648)">
      <rect x="250" y="640" width="36" height="88" rx="17" fill="#f1be96"/>
    </g>
    <!-- front leg, stepping forward -->
    <g transform="rotate(-18 332 648)">
      <rect x="314" y="640" width="36" height="88" rx="17" fill="#f1be96"/>
    </g>
    <!-- flip-flops -->
    <ellipse cx="232" cy="731" rx="42" ry="13" transform="rotate(10 232 731)" fill="#4e8fd1"/>
    <ellipse cx="362" cy="734" rx="42" ry="13" transform="rotate(-6 362 734)" fill="#4e8fd1"/>

    <!-- shorts in profile -->
    <path d="M 238 588 L 368 588 L 374 654 Q 375 670 360 670 L 318 670 Q 309 670 307 660
             Q 304 651 301 651 Q 298 651 295 660 Q 293 670 284 670 L 248 670 Q 233 670 234 654 Z"
          fill="#46557f"/>
  </g>

  <!-- near arm: one single bent silhouette, elbow poking out clearly behind his back,
       forearm slipping behind the tee toward the back pocket (hand hidden away) -->
  <path d="M 298 410
           Q 230 420 200 476
           Q 220 500 254 522
           L 250 562
           Q 204 552 168 530
           Q 138 512 144 484
           Q 158 444 208 424
           Q 252 408 286 404
           Q 296 402 298 410 Z"
        fill="#f1be96" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>

  <!-- back pocket swallowing the hand -->
  <path d="M 246 596 Q 278 586 310 596 L 306 648 Q 276 660 250 648 Z"
        fill="#46557f" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>

  <!-- tee, hunched forward -->
  <path d="M 315 398 Q 270 400 248 416 Q 228 434 224 480 Q 220 545 230 600
           Q 275 610 320 608 Q 362 606 386 598 Q 394 545 392 492 Q 390 438 372 416
           Q 350 400 315 398 Z"
        fill="#f6dec6" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>

  <!-- head, dropped low so it sinks into the shoulders (no neck showing) -->
  <ellipse cx="310" cy="278" rx="145" ry="140" fill="#f1be96" stroke="#3b2a21" stroke-width="9"/>

  <!-- blush on the near cheek -->
  <ellipse cx="392" cy="328" rx="18" ry="11" fill="#f2937b" opacity="0.45"/>

  <!-- button nose poking past the profile edge -->
  <ellipse cx="446" cy="322" rx="17" ry="13" fill="#e8ac80" stroke="#3b2a21" stroke-width="7"/>

  <!-- one sad, downcast eye -->
  <circle cx="378" cy="290" r="12.5" fill="#3b2a21"/>
  <circle cx="381" cy="286" r="4.5" fill="#ffffff"/>
  <path d="M 348 246 Q 374 250 394 272" fill="none" stroke="#3b2a21" stroke-width="9" stroke-linecap="round"/>

  <!-- little frown -->
  <path d="M 394 366 Q 412 354 430 364" fill="none" stroke="#3b2a21" stroke-width="7" stroke-linecap="round"/>

  <!-- backwards cap dome in profile: band edge low over the brow, bill already behind -->
  <path d="M 172 262 Q 150 132 312 114 Q 462 130 450 240 Q 375 216 295 224 Q 218 236 172 262 Z"
        fill="#33415e" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
  <path d="M 185 252 Q 315 200 440 236" fill="none" stroke="#283349" stroke-width="5" stroke-linecap="round"/>
  <path d="M 308 118 Q 258 168 240 228 M 308 118 Q 360 164 378 218" fill="none" stroke="#283349" stroke-width="5" stroke-linecap="round"/>
  <circle cx="310" cy="116" r="10" fill="#283349" stroke="#3b2a21" stroke-width="6"/>
</svg>
