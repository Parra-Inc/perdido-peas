<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Katie, cheering: right arm rotated rigidly up at the shoulder pivot; brown bob, round sunglasses -->
  <g transform="translate(66 165.44) scale(0.78)">

    <!-- wavy brown hair falling BEHIND the back: drawn first so the body covers its middle -->
    <path d="M 300 96
             Q 400 100 442 150
             Q 470 190 464 238
             Q 482 278 468 318
             Q 454 350 470 388
             Q 482 420 464 450
             Q 450 468 430 460
             Q 370 472 300 472
             Q 230 472 170 460
             Q 150 468 136 450
             Q 118 420 130 388
             Q 146 350 132 318
             Q 118 278 136 238
             Q 130 190 158 150
             Q 200 100 300 96 Z" fill="#5f4530" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 450 180 Q 468 230 454 280 Q 442 322 458 364 M 150 180 Q 132 230 146 280 Q 158 322 142 364" fill="none" stroke="#46311f" stroke-width="6" stroke-linecap="round"/>
    <path d="M 464 320 Q 452 370 466 412 Q 472 438 456 452 M 136 320 Q 148 370 134 412 Q 128 438 144 452" fill="none" stroke="#46311f" stroke-width="6" stroke-linecap="round"/>
    <path d="M 442 160 Q 456 205 446 250 Q 438 288 450 320 M 158 160 Q 144 205 154 250 Q 162 288 150 320" fill="none" stroke="#7a5c42" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <g stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <!-- legs -->
      <rect x="250" y="640" width="36" height="88" rx="17" fill="#f1be96"/>
      <rect x="314" y="640" width="36" height="88" rx="17" fill="#f1be96"/>
      <!-- flip-flops -->
      <ellipse cx="268" cy="738" rx="44" ry="14" fill="#f5c95c"/>
      <ellipse cx="332" cy="738" rx="44" ry="14" fill="#f5c95c"/>
      <!-- shorts -->
      <path d="M 240 588 L 360 588 L 364 656 Q 365 672 350 672 L 314 672 Q 305 672 303 662 Q 301 654 300 654 Q 299 654 297 662 Q 295 672 286 672 L 250 672 Q 235 672 236 656 Z" fill="#f2ede4"/>
    </g>

    <!-- right arm rotated up in a cheer -->
    <g transform="rotate(-140 380 490)">
      <path d="M 372 484 Q 398 492 409 520 Q 420 548 422 570 Q 423 588 412 592 Q 400 594 395 580 Q 389 565 388 540 Q 386 506 372 484 Z" fill="#f1be96" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
      <ellipse cx="414" cy="601" rx="23" ry="26" transform="rotate(-8 414 601)" fill="#f1be96" stroke="#3b2a21" stroke-width="9"/>
    </g>
    <!-- left arm stays down -->
    <path d="M 228 484 Q 202 492 191 520 Q 180 548 178 570 Q 177 588 188 592 Q 200 594 205 580 Q 211 565 212 540 Q 214 506 228 484 Z" fill="#f1be96" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="186" cy="601" rx="23" ry="26" transform="rotate(8 186 601)" fill="#f1be96" stroke="#3b2a21" stroke-width="9"/>

    <g stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <!-- tee -->
      <path d="M 300 382 Q 272 384 255 393 Q 222 400 205 418 Q 188 448 185 500 Q 190 512 205 508 Q 224 504 238 496 L 232 598 Q 268 606 300 606 Q 332 606 368 598 L 362 496 Q 376 504 395 508 Q 410 512 415 500 Q 412 448 395 418 Q 378 400 345 393 Q 328 384 300 382 Z" fill="#f7ccd4"/>
      <path d="M 262 394 Q 300 420 338 394" fill="none" stroke-width="6"/>

      <!-- neck, ears, head -->
      <rect x="278" y="360" width="44" height="48" rx="12" fill="#f1be96"/>
      <circle cx="142" cy="274" r="16" fill="#f1be96"/>
      <circle cx="458" cy="274" r="16" fill="#f1be96"/>
      <ellipse cx="300" cy="252" rx="150" ry="145" fill="#f1be96"/>
    </g>

    <!-- face (shifted down slightly to clear the bangs) -->
    <ellipse cx="206" cy="308" rx="20" ry="12" fill="#f2937b" opacity="0.6"/>
    <ellipse cx="394" cy="308" rx="20" ry="12" fill="#f2937b" opacity="0.6"/>
    <ellipse cx="300" cy="308" rx="12" ry="9" fill="#e0a57e" stroke="#3b2a21" stroke-width="7"/>
    <path d="M 276 334 Q 300 342 324 334 Q 320 360 300 363 Q 280 360 276 334 Z" fill="#4a2b22" stroke="#3b2a21" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 282 340 Q 300 345 318 340 Q 316 350 300 352 Q 284 350 282 340 Z" fill="#ffffff"/>
    <path d="M 274 332 q -7 -2 -10 -8 M 326 332 q 7 -2 10 -8" fill="none" stroke="#3b2a21" stroke-width="6" stroke-linecap="round"/>

    <!-- big cute brown eyes: double sparkle and lashes -->
    <circle cx="258" cy="272" r="17" fill="#7a4b2a"/>
    <circle cx="342" cy="272" r="17" fill="#7a4b2a"/>
    <circle cx="258" cy="272" r="8.5" fill="#26211d"/>
    <circle cx="342" cy="272" r="8.5" fill="#26211d"/>
    <circle cx="263" cy="265" r="5.5" fill="#ffffff"/>
    <circle cx="347" cy="265" r="5.5" fill="#ffffff"/>
    <circle cx="252" cy="279" r="2.6" fill="#ffffff" opacity="0.9"/>
    <circle cx="336" cy="279" r="2.6" fill="#ffffff" opacity="0.9"/>
    <path d="M 245 261 L 238 254 M 251 257 L 247 249 M 258 255 L 257 247" fill="none" stroke="#3b2a21" stroke-width="4" stroke-linecap="round"/>
    <path d="M 355 261 L 362 254 M 349 257 L 353 249 M 342 255 L 343 247" fill="none" stroke="#3b2a21" stroke-width="4" stroke-linecap="round"/>
    <path d="M 236 248 Q 258 239 280 247 M 320 247 Q 342 239 364 248" fill="none" stroke="#3f2d1e" stroke-width="7" stroke-linecap="round"/>

    <!-- front hairline: smooth dome with soft bangs sweep and wavy strands -->
    <path d="M 152 244 Q 146 116 300 100 Q 454 116 448 244 Q 380 196 300 196 Q 220 196 152 244 Z" fill="#5f4530" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 224 210 Q 232 224 226 240 M 376 210 Q 368 224 374 240" fill="none" stroke="#46311f" stroke-width="5" stroke-linecap="round"/>
    <path d="M 198 212 Q 186 184 198 160 Q 208 140 200 122 M 402 212 Q 414 184 402 160 Q 392 140 400 122" fill="none" stroke="#46311f" stroke-width="5" stroke-linecap="round"/>
    <path d="M 252 194 Q 242 166 254 144 Q 264 124 256 108 M 348 194 Q 358 166 346 144 Q 336 124 344 108" fill="none" stroke="#46311f" stroke-width="5" stroke-linecap="round"/>

    <!-- pale pink bow on the side of her crown, matches her shirt -->
    <path d="M 396 136 L 370 118 Q 360 134 370 148 Z" fill="#f7ccd4" stroke="#3b2a21" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 396 136 L 422 116 Q 434 130 424 146 Z" fill="#f7ccd4" stroke="#3b2a21" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="396" cy="134" r="9" fill="#f7ccd4" stroke="#3b2a21" stroke-width="6"/>

    <!-- round sunglasses perched on her head: bigger lenses, glints, temple stubs -->
    <path d="M 239 128 L 226 137 M 361 128 L 374 137" fill="none" stroke="#3b2a21" stroke-width="6" stroke-linecap="round"/>
    <circle cx="260" cy="126" r="21" fill="#2d2622" stroke="#3b2a21" stroke-width="7"/>
    <circle cx="340" cy="126" r="21" fill="#2d2622" stroke="#3b2a21" stroke-width="7"/>
    <path d="M 281 122 Q 300 112 319 122" fill="none" stroke="#3b2a21" stroke-width="7" stroke-linecap="round"/>
    <circle cx="253" cy="119" r="4.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="333" cy="119" r="4.5" fill="#ffffff" opacity="0.9"/>
    <path d="M 250 131 q 4 8 12 10 M 330 131 q 4 8 12 10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
