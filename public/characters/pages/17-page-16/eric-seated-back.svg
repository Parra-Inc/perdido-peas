    <!-- relaxed arms, hands on the sand -->
    <path d="M 388 528 Q 416 540 428 574 Q 438 616 440 664 Q 441 686 429 690 Q 417 692 412 677 Q 404 644 401 600 Q 398 554 386 534 Z" fill="#f1be96"/>
    <ellipse cx="432" cy="702" rx="21" ry="24" fill="#f1be96"/>
