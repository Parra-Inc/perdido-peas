  <path d="M 150 310 Q 150 192 300 174 Q 450 192 450 310 Q 380 284 300 284 Q 220 284 150 310 Z" fill="#33415e" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
  <path d="M 161 301 Q 300 272 439 301" fill="none" stroke="#283349" stroke-width="5" stroke-linecap="round"/>
  <path d="M 300 278 Q 262 230 246 190 M 300 278 Q 338 230 354 190" fill="none" stroke="#283349" stroke-width="5" stroke-linecap="round"/>
  <circle cx="300" cy="175" r="10" fill="#283349" stroke="#3b2a21" stroke-width="6"/>
  <path d="M 206 310 Q 300 280 394 310 Q 400 318 396 328 Q 300 366 204 328 Q 200 318 206 310 Z" fill="#283349" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
