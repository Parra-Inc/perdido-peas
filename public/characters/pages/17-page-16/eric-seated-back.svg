    <path d="M 264 480 Q 300 500 336 480" fill="none" stroke-width="6"/>
    <!-- neck, ears, head from behind (clean shaven, no face) -->
    <rect x="278" y="436" width="44" height="52" rx="12" fill="#f1be96"/>
    <circle cx="142" cy="352" r="16" fill="#f1be96"/>
    <circle cx="458" cy="352" r="16" fill="#f1be96"/>
    <ellipse cx="300" cy="330" rx="150" ry="145" fill="#f1be96"/>
