<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Ian seated, back view: white forward cap from behind, brown hair flowing out below, green tee -->
  <g transform="translate(9 22.6) scale(0.97)">
    <g stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <!-- relaxed arms, hands on the sand -->
      <path d="M 388 528 Q 416 540 428 574 Q 438 616 440 664 Q 441 686 429 690 Q 417 692 412 677 Q 404 644 401 600 Q 398 554 386 534 Z" fill="#e8ae83"/>
      <ellipse cx="432" cy="702" rx="21" ry="24" fill="#e8ae83"/>
      <path d="M 212 528 Q 184 540 172 574 Q 162 616 160 664 Q 159 686 171 690 Q 183 692 188 677 Q 196 644 199 600 Q 202 554 214 534 Z" fill="#e8ae83"/>
      <ellipse cx="168" cy="702" rx="21" ry="24" fill="#e8ae83"/>
      <!-- rounded tee back -->
      <path d="M 300 466 Q 254 468 228 486 Q 198 504 192 544 L 186 690 Q 184 726 222 728 L 378 728 Q 416 726 414 690 L 408 544 Q 402 504 372 486 Q 346 468 300 466 Z" fill="#bfe3c5"/>
      <path d="M 264 480 Q 300 500 336 480" fill="none" stroke-width="6"/>
      <!-- neck and head from behind (no face) -->
      <rect x="278" y="436" width="44" height="52" rx="12" fill="#e8ae83"/>
      <ellipse cx="300" cy="330" rx="150" ry="145" fill="#e8ae83"/>
    </g>
    <!-- medium brown hair flowing out under the cap, covering the back of the head -->
    <path d="M 152 310 Q 300 282 448 310 Q 452 376 428 420 Q 300 456 172 420 Q 148 376 152 310 Z" fill="#7d5a3c" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 210 344 Q 218 384 206 416 M 390 344 Q 382 384 394 416 M 300 352 Q 296 392 302 426" fill="none" stroke="#5d4128" stroke-width="5" stroke-linecap="round"/>
    <!-- white cap dome from behind, brim hidden in front -->
    <path d="M 150 310 Q 150 192 300 174 Q 450 192 450 310 Q 380 284 300 284 Q 220 284 150 310 Z" fill="#faf6ee" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 300 278 Q 262 230 246 190 M 300 278 Q 338 230 354 190" fill="none" stroke="#e5dbc8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="300" cy="175" r="10" fill="#e5dbc8" stroke="#3b2a21" stroke-width="6"/>
  </g>
</svg>
