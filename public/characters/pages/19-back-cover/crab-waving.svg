<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90">
  <!-- back-cover crab: waving one claw high, tiny sunglasses on -->
  <g stroke="#3b2a21" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <line x1="28" y1="70" x2="14" y2="82" stroke-width="6"/>
    <line x1="92" y1="70" x2="106" y2="82" stroke-width="6"/>
    <line x1="34" y1="76" x2="26" y2="86" stroke-width="6"/>
    <line x1="86" y1="76" x2="94" y2="86" stroke-width="6"/>
    <!-- resting left claw -->
    <circle cx="26" cy="34" r="13" fill="#f07f3c"/>
    <path d="M 22 28 L 30 40" stroke="#c85f24" stroke-width="4"/>
    <line x1="42" y1="52" x2="30" y2="42" stroke-width="6"/>
    <!-- waving right claw, raised high -->
    <line x1="80" y1="50" x2="94" y2="28" stroke-width="6"/>
    <circle cx="100" cy="18" r="13" fill="#f07f3c"/>
    <path d="M 104 10 L 94 24" stroke="#c85f24" stroke-width="4"/>
    <ellipse cx="60" cy="62" rx="34" ry="22" fill="#f07f3c"/>
    <line x1="50" y1="38" x2="50" y2="50" stroke-width="5"/>
    <line x1="70" y1="38" x2="70" y2="50" stroke-width="5"/>
  </g>
  <circle cx="50" cy="36" r="7" fill="#ffffff" stroke="#3b2a21" stroke-width="4"/>
  <circle cx="70" cy="36" r="7" fill="#ffffff" stroke="#3b2a21" stroke-width="4"/>
  <!-- tiny sunglasses -->
  <g stroke="#3b2a21" stroke-linecap="round">
    <circle cx="50" cy="36" r="8.5" fill="#33415e" stroke-width="4"/>
    <circle cx="70" cy="36" r="8.5" fill="#33415e" stroke-width="4"/>
    <path d="M 58.5 36 L 61.5 36" fill="none" stroke-width="4"/>
    <path d="M 45.5 39.5 L 52.5 32.5 M 65.5 39.5 L 72.5 32.5" fill="none" stroke="#8ed8ef" stroke-width="3"/>
  </g>
  <path d="M 52 66 Q 60 72 68 66" fill="none" stroke="#3b2a21" stroke-width="4" stroke-linecap="round"/>
</svg>
