<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Eric, page 6 variant: goggles pushed up on his forehead, right hand raised to shade
       his eyes, small searching mouth. Cap stays BACKWARDS, bill tab behind the head. -->

  <g stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">

    <!-- cap bill: single tab poking out behind the head -->
    <path d="M 435 212 Q 512 210 522 226 Q 528 244 518 252 Q 505 258 435 252 Z" fill="#283349"/>

    <!-- legs (below the waterline on the page) -->
    <rect x="250" y="640" width="36" height="88" rx="17" fill="#f1be96"/>
    <rect x="314" y="640" width="36" height="88" rx="17" fill="#f1be96"/>

    <!-- shorts, fitted -->
    <path d="M 240 588 L 360 588 L 364 656 Q 365 672 350 672 L 314 672 Q 305 672 303 662 Q 301 654 300 654 Q 299 654 297 662 Q 295 672 286 672 L 250 672 Q 235 672 236 656 Z" fill="#46557f"/>
  </g>

  <!-- left arm (viewer left) hangs as in the stock pose -->
  <path d="M 228 484
           Q 202 492 191 520
           Q 180 548 178 570
           Q 177 588 188 592
           Q 200 594 205 580
           Q 211 565 212 540
           Q 214 506 228 484 Z" fill="#f1be96" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
  <ellipse cx="186" cy="601" rx="23" ry="26" transform="rotate(8 186 601)" fill="#f1be96" stroke="#3b2a21" stroke-width="9"/>

  <g stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- tee -->
    <path d="M 300 382
             Q 272 384 255 393
             Q 222 400 205 418
             Q 188 448 185 500
             Q 190 512 205 508
             Q 224 504 238 496
             L 232 598
             Q 268 606 300 606
             Q 332 606 368 598
             L 362 496
             Q 376 504 395 508
             Q 410 512 415 500
             Q 412 448 395 418
             Q 378 400 345 393
             Q 328 384 300 382 Z" fill="#f6dec6"/>
    <!-- collar -->
    <path d="M 262 394 Q 300 420 338 394" fill="none" stroke-width="6"/>

    <!-- neck, then ears tucked behind, then head over them -->
    <rect x="278" y="360" width="44" height="48" rx="12" fill="#f1be96"/>
    <circle cx="142" cy="274" r="16" fill="#f1be96"/>
    <circle cx="458" cy="274" r="16" fill="#f1be96"/>
    <ellipse cx="300" cy="252" rx="150" ry="145" fill="#f1be96"/>
  </g>

  <!-- blush -->
  <ellipse cx="206" cy="300" rx="20" ry="12" fill="#f2937b" opacity="0.45"/>
  <ellipse cx="394" cy="300" rx="20" ry="12" fill="#f2937b" opacity="0.45"/>

  <!-- nose -->
  <ellipse cx="300" cy="300" rx="19" ry="14" fill="#e8ac80" stroke="#3b2a21" stroke-width="7"/>

  <!-- small searching mouth -->
  <ellipse cx="300" cy="347" rx="16" ry="20" fill="#4a2b22" stroke="#3b2a21" stroke-width="7"/>

  <!-- eyes (brows hidden by the pushed-up goggles) -->
  <circle cx="258" cy="266" r="13" fill="#3b2a21"/>
  <circle cx="342" cy="266" r="13" fill="#3b2a21"/>
  <circle cx="262" cy="261" r="4.5" fill="#ffffff"/>
  <circle cx="346" cy="261" r="4.5" fill="#ffffff"/>

  <!-- backwards cap dome -->
  <path d="M 150 232
           Q 150 114 300 96
           Q 450 114 450 232
           Q 380 206 300 206
           Q 220 206 150 232 Z" fill="#33415e" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
  <path d="M 161 223 Q 300 194 439 223" fill="none" stroke="#283349" stroke-width="5" stroke-linecap="round"/>
  <path d="M 300 200 Q 262 152 246 112 M 300 200 Q 338 152 354 112" fill="none" stroke="#283349" stroke-width="5" stroke-linecap="round"/>
  <circle cx="300" cy="97" r="10" fill="#283349" stroke="#3b2a21" stroke-width="6"/>

  <!-- goggles pushed up on the forehead: coral strap, sky-blue lenses -->
  <path d="M 154 216 Q 300 188 446 216 L 446 234 Q 300 206 154 234 Z" fill="#ef6f6c" stroke="#3b2a21" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 284 213 L 316 213" fill="none" stroke="#3b2a21" stroke-width="9" stroke-linecap="round"/>
  <circle cx="262" cy="214" r="25" fill="#8ed8ef" stroke="#3b2a21" stroke-width="8"/>
  <circle cx="338" cy="214" r="25" fill="#8ed8ef" stroke="#3b2a21" stroke-width="8"/>

  <!-- right arm raised, hand shading his eyes: one bent silhouette plus mitten hand -->
  <path d="M 406 485
           Q 450 420 470 325
           Q 474 311 465 307
           Q 446 278 423 255
           Q 405 251 397 277
           Q 417 300 439 329
           Q 424 404 388 468
           Q 396 484 406 485 Z" fill="#f1be96" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
  <ellipse cx="402" cy="252" rx="24" ry="26" transform="rotate(-38 402 252)" fill="#f1be96" stroke="#3b2a21" stroke-width="9"/>
</svg>
