<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Ben: very pale and skinny, brown man bun -->
  <g transform="translate(21 52.64) scale(0.93)">

    <g stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <!-- legs (skinny) -->
      <rect x="256" y="640" width="30" height="88" rx="14" fill="#f9e6d2"/>
      <rect x="314" y="640" width="30" height="88" rx="14" fill="#f9e6d2"/>
      <!-- flip-flops -->
      <ellipse cx="271" cy="738" rx="40" ry="13" fill="#9aa5b1"/>
      <ellipse cx="329" cy="738" rx="40" ry="13" fill="#9aa5b1"/>
      <!-- shorts (narrow) -->
      <path d="M 248 588 L 352 588 L 355 652 Q 356 668 342 668 L 312 668 Q 304 668 302 659 Q 300 652 300 652 Q 300 652 298 659 Q 296 668 288 668 L 258 668 Q 244 668 245 652 Z" fill="#46557f"/>
    </g>

    <!-- arms (thin, bare shoulders for the tank top) -->
    <g transform="rotate(-29.7 352 424)"><path d="M 348 416 Q 376 424 390 464 Q 402 504 404 544 Q 405 566 394 570 Q 383 574 378 558 Q 371 536 370 504 Q 368 452 342 428 Q 338 418 348 416 Z" fill="#f9e6d2" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="398" cy="580" rx="20" ry="23" transform="rotate(-8 398 580)" fill="#f9e6d2" stroke="#3b2a21" stroke-width="9"/></g>
    <g transform="rotate(29.7 248 424)"><path d="M 252 416 Q 224 424 210 464 Q 198 504 196 544 Q 195 566 206 570 Q 217 574 222 558 Q 229 536 230 504 Q 232 452 258 428 Q 262 418 252 416 Z" fill="#f9e6d2" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="202" cy="580" rx="20" ry="23" transform="rotate(8 202 580)" fill="#f9e6d2" stroke="#3b2a21" stroke-width="9"/></g>

    <g stroke="#3b2a21" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <!-- bare chest behind the tank neckline -->
      <ellipse cx="300" cy="442" rx="42" ry="28" fill="#f9e6d2" stroke="none"/>
      <!-- tank top -->
      <path d="M 250 406 Q 256 444 240 482 L 234 594 Q 268 606 300 606 Q 332 606 366 594 L 360 482 Q 344 444 350 406 L 334 402 Q 300 460 266 402 Z" fill="#a8c8a0"/>

      <!-- man bun behind the crown -->
      <circle cx="300" cy="100" r="26" fill="#6b4e35"/>

      <!-- neck, ears, head (narrower) -->
      <rect x="282" y="360" width="36" height="64" rx="12" fill="#f9e6d2"/>
      <circle cx="156" cy="274" r="15" fill="#f9e6d2"/>
      <circle cx="444" cy="274" r="15" fill="#f9e6d2"/>
      <ellipse cx="300" cy="252" rx="138" ry="145" fill="#f9e6d2"/>
    </g>
    <ellipse cx="300" cy="124" rx="15" ry="6" fill="#4e3826"/>

    <!-- face (standard heights, no hat) -->
    <ellipse cx="216" cy="300" rx="20" ry="12" fill="#f2937b" opacity="0.45"/>
    <ellipse cx="384" cy="300" rx="20" ry="12" fill="#f2937b" opacity="0.45"/>
    <ellipse cx="300" cy="300" rx="19" ry="14" fill="#e3c3a4" stroke="#3b2a21" stroke-width="7"/>
    <path d="M 278 326 Q 300 318 322 326 Q 328 354 300 360 Q 272 354 278 326 Z" fill="#4a2b22" stroke="#3b2a21" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 284 329 Q 300 324 316 329 Q 314 337 300 339 Q 286 337 284 329 Z" fill="#ffffff"/>

    <!-- eyes -->
    <circle cx="258" cy="266" r="13" fill="#3b2a21"/>
    <circle cx="342" cy="266" r="13" fill="#3b2a21"/>
    <circle cx="262" cy="261" r="4.5" fill="#ffffff"/>
    <circle cx="346" cy="261" r="4.5" fill="#ffffff"/>
    <path d="M 236 240 Q 258 231 280 239 M 320 239 Q 342 231 364 240" fill="none" stroke="#4e3826" stroke-width="9" stroke-linecap="round"/>

    <!-- hair pulled back into the bun -->
    <path d="M 166 234 Q 160 118 300 100 Q 440 118 434 234 Q 372 206 300 206 Q 228 206 166 234 Z" fill="#6b4e35" stroke="#3b2a21" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 252 122 Q 300 108 348 122 M 218 152 Q 300 128 382 152" fill="none" stroke="#4e3826" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
