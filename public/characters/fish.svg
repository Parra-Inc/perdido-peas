<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100">
  <!-- the fish (pops up and shrugs on page 6): coral body, sunshine-yellow fins, big friendly eye -->
  <g stroke="#3b2a21" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M 94 50 L 122 30 Q 115 50 122 70 Z" fill="#f7c73f"/>
    <!-- dorsal fin -->
    <path d="M 46 27 Q 56 8 78 12 Q 67 20 65 28 Z" fill="#f7c73f"/>
    <!-- belly fin -->
    <path d="M 54 73 Q 58 88 74 88 Q 67 78 67 71 Z" fill="#f7c73f"/>
    <!-- body -->
    <ellipse cx="58" cy="50" rx="42" ry="28" fill="#f2705f"/>
    <!-- stripes -->
    <path d="M 62 25 Q 54 50 62 75" fill="none" stroke="#d95547" stroke-width="4"/>
    <path d="M 80 29 Q 73 50 80 71" fill="none" stroke="#d95547" stroke-width="4"/>
    <!-- side fin -->
    <path d="M 58 50 Q 76 46 80 60 Q 68 66 58 58 Z" fill="#f7c73f"/>
  </g>
  <!-- eye -->
  <circle cx="33" cy="42" r="7" fill="#ffffff" stroke="#3b2a21" stroke-width="4"/>
  <circle cx="32" cy="43" r="2.6" fill="#3b2a21"/>
  <!-- smile -->
  <path d="M 22 58 Q 28 63 36 61" fill="none" stroke="#3b2a21" stroke-width="4" stroke-linecap="round"/>
</svg>
